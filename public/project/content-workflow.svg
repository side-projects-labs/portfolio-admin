<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="860" rx="24" fill="#f5f5f0"/>
<g font-family="Apple SD Gothic Neo, sans-serif" fill="#17252a">
<text x="72" y="77" font-size="18" letter-spacing="3" fill="#526d63">PORTFOLIO ADMIN · CONTENT WORKFLOW</text>
<text x="72" y="137" font-size="42" font-weight="700">코드를 수정하던 일에서, 콘텐츠를 관리하는 흐름으로</text>
<text x="72" y="179" font-size="22" fill="#52606b">소개할 프로젝트가 늘어날수록 필요한 작업을 관리 화면과 데이터 저장 영역으로 나눴습니다.</text>
<rect x="72" y="225" width="382" height="252" rx="18" fill="#fff" stroke="#dce2dc"/>
<text x="100" y="266" font-size="17" fill="#668076">01 · 작성</text>
<text x="100" y="312" font-size="30" font-weight="700">프로젝트 정보와 본문</text>
<text x="100" y="356" font-size="22">제목 · 요약 · 기술 스택 · 링크</text>
<text x="100" y="393" font-size="22">마크다운 에디터와 미리보기</text>
<text x="100" y="440" font-size="18" fill="#63716a">어떤 경험을 어떻게 소개할지 정리</text>
<path d="M464 351 H500" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="514" y="225" width="382" height="252" rx="18" fill="#e3eee7" stroke="#c1d7c8"/>
<text x="542" y="266" font-size="17" fill="#426654">02 · 관리</text>
<text x="542" y="312" font-size="30" font-weight="700">공개 상태와 노출 순서</text>
<text x="542" y="356" font-size="22">프로젝트 목록에서 발행 여부 조정</text>
<text x="542" y="393" font-size="22">이동 버튼 · 드래그로 순서 변경</text>
<text x="542" y="440" font-size="18" fill="#496756">콘텐츠 변경은 관리 화면에서 처리</text>
<path d="M906 351 H942" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="956" y="225" width="412" height="252" rx="18" fill="#173e35"/>
<text x="984" y="266" font-size="17" fill="#b5d9c5">03 · 전달</text>
<text x="984" y="312" font-size="30" font-weight="700" fill="#fff">portfolio-api</text>
<text x="984" y="356" font-size="22" fill="#eef6f0">프로젝트 메타데이터 · 본문 저장</text>
<text x="984" y="393" font-size="22" fill="#eef6f0">공개 포트폴리오의 콘텐츠로 활용</text>
<text x="984" y="440" font-size="18" fill="#b5d9c5">화면과 콘텐츠 저장의 역할 분리</text>
<text x="72" y="552" font-size="26" font-weight="700">이미지는 파일로 저장하고, 콘텐츠에는 URL을 연결합니다.</text>
<rect x="72" y="592" width="1296" height="178" rx="18" fill="#fff" stroke="#dce2dc"/>
<text x="108" y="639" font-size="18" fill="#668076">파일 업로드 흐름</text>
<text x="108" y="688" font-size="25" font-weight="600">파일 선택</text>
<path d="M261 680 H315" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="688" font-size="25" font-weight="600">서버에서 WebP 변환</text>
<path d="M615 680 H670" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="705" y="688" font-size="25" font-weight="600">Supabase Storage</text>
<path d="M962 680 H1017" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1052" y="688" font-size="25" font-weight="600">공개 URL 연결</text>
<text x="108" y="738" font-size="18" fill="#63716a">기존 공개 이미지 URL을 직접 입력하는 방식도 지원합니다.</text>
<text x="72" y="816" font-size="17" fill="#63716a">구현된 콘텐츠 관리 흐름을 설명하는 도식입니다. 화면 캡처와 구분해 사용합니다.</text>
</g></svg>